        <h1>J P Extrusiontech (Pvt) Ltd.</h1>
        <p>Established in 1987, J P Extrusiontech (Pvt) Ltd. (also known as JP Extrusiontech or JPEL) manufactures and exports plastic processing machinery from Ankleshwar, Gujarat, India. The company operates a 70,000 sq.m. manufacturing facility and serves customers across 44+ countries worldwide.</p>
        <h2>Products</h2>
        <ul>
          <li><strong>Tape Extrusion Lines</strong> — Comprehensive range producing high-quality PP/HDPE tapes, 150–900 kg/hr output. End applications: woven &amp; leno bags, jumbo bags (FIBCs), tarpaulins, carpet backings, geotextiles, wrapping fabrics, ropes and twines.</li>
          <li><strong>Circular Weaving Machines (Circular Looms)</strong> — Jaiko Industries looms for weaving light to heavy weight tubular or flat PP/HDPE fabrics; 4-shuttle (leno/open mesh for fruits &amp; vegetables), 6-shuttle (cement, fertilizer, polymer granules, chemicals, grains, animal feed, seeds), 8-shuttle (wide-width for FIBCs, tarpaulins, geo &amp; agro textiles).</li>
          <li><strong>Winding Machines</strong> — Inverter/Electronic Tape Winder, Auto Doffing Tape Winder, and Jumbo Winder for high-capacity fibrillated tape winding. Applications: woven &amp; leno bags, FIBCs, tarpaulins, carpet backings, geotextiles, ropes and twines.</li>
          <li><strong>Extrusion Coating Lines</strong> — Coats thin layers of polyolefins (LDPE/PP) on paper, cotton cloth, woven fabrics, jute fabric, aluminum foil, BOPP film, polyester film — up to 5200 mm web width. Tandem lamination plant for multilayer laminates up to 5 layers.</li>
          <li><strong>Flexographic Printing Machines</strong> — High-speed PLC-based 4/6/8-colour flexo printing for woven sacks, with inline corona treatment, micro perforation, twist gusseting, cutting/winding system for HDPE/PP laminated and un-laminated woven fabrics.</li>
          <li><strong>Bag Conversion Lines</strong> — Cutting-edge lines for bottom-folded and sewn woven sacks from tubular PP/HDPE fabric. JPBCL-850 handles cutting, bottom folding, sewing, and stacking woven fabric to produce durable, high-quality sacks.</li>
          <li><strong>Block Bottom Sack Conversion Lines (BBB)</strong> — New generation AD VALVE™ pocket bag making machine with heat sealing technology, modular design, and AI visual detection. Applications: cement, chemicals, animal feed, agricultural produce, food &amp; industrial powders.</li>
          <li><strong>Recycling Lines (PP/PE)</strong> — Systems for washing and processing PP/PE films and bags; transforms waste and heavily soiled materials into high-quality recycled materials with advanced washing, drying, and filtration processes.</li>
          <li><strong>PET Washing Lines</strong> — Advanced recycling lines for processing oriented HDPE/PP tapes, woven fabric cuttings, industrial plastic waste, and general-purpose plastics (LDPE, LLDPE, HIPS, PP, HDPE).</li>
          <li><strong>Battery Box Recycling Lines</strong> — Advanced solutions for recovering high-quality ABS (Acrylonitrile Butadiene Styrene) plastics from used and damaged car battery boxes.</li>
          <li><strong>Monofilament Lines</strong> — Highly efficient machines producing HDPE, PP, and Nylon monofilaments. Applications: ropes &amp; twines, toothbrush bristles, fishing nets, mosquito nets, doll/wig hair.</li>
          <li><strong>PP/PET Box Strapping Lines</strong> — PET Box Strap Line (100% PET flakes/virgin granules, with Dehumidified Air Dryer and Crystallizer) and PP Box Strap Line for packaging, logistics, construction, agriculture, and textiles.</li>
          <li><strong>Multilayer Sheet Lines</strong> — Monolayer and multilayer sheet extrusion lines for HIPS, ABS, PP, PET, and PVC sheets. Applications: thermoforming, vacuum forming, office files, luggage, office furniture, roofing.</li>
          <li><strong>Multilayer Cast Film Lines</strong> — Chill Roll Cast Film Lines producing multi-ply films (15–150 microns): stretch films, cling films, barrier films, masking films, CPP films, and blister films.</li>
          <li><strong>Flexible Packaging Lines</strong> — Extrusion coating for flexible packaging applying polymer layers (LDPE, LLDPE, PP, EVA, EAA, EVOH, NUCREL SERLYN) onto substrates (BOPP, paper, aluminum foil, CPP, polyester, METPET) to create multi-layer laminates.</li>
        </ul>
